name: 법령 자동 갱신

on:
  schedule:
    - cron: "37 18 * * *"   # 매일 한국시간 새벽 3:37 (사고사례 갱신 20분 뒤)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 법제처 API에서 법령 받기
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python scripts/fetch_laws.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/laws.json
          git diff --cached --quiet && exit 0
          git commit -m "법령 자동 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
