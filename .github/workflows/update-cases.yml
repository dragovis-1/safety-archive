name: 사고사례 자동 갱신

on:
  schedule:
    - cron: "17 18 * * *"   # 매일 한국시간 새벽 3:17
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API에서 사례 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_cases.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cases.json
          git diff --cached --quiet || git commit -m "사고사례 자동 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
