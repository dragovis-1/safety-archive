name: AI 검색 색인(임베딩) 갱신

on:
  workflow_run:
    workflows: ["사고사례 자동 갱신", "법령 자동 갱신"]
    types: [completed]
  push:
    branches: [main]
    paths: ["scripts/build_embeddings.py", ".github/workflows/build-embeddings.yml"]
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: embeddings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small
      - name: 패키지 설치
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet sentence-transformers numpy
      - name: 임베딩 만들기
        run: python scripts/build_embeddings.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vectors.bin data/vectors.json
          git diff --cached --quiet && exit 0
          git commit -m "AI 검색 색인 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push
